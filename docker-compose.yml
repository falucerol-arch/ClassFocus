services:
  postgres:
    image: postgres:16-alpine
    container_name: classfocus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: classfocus
      POSTGRES_USER: classfocus
      POSTGRES_PASSWORD: classfocus123
    ports:
      - "5432:5432"
    volumes:
      - classfocus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classfocus -d classfocus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  classfocus_postgres_data:
